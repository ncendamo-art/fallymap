<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracce">
<meta name="theme-color" content="#17493f">
<link rel="manifest" href="manifest.json">
<title>Tracce offline</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:16px/1.4 system-ui,-apple-system,sans-serif;color:#12332b}
#map{position:absolute;inset:0}
.leaflet-top{padding-top:env(safe-area-inset-top,0px)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#f4f7f5;border-top:1px solid #c9d6d0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.stats{display:flex;gap:16px;margin-bottom:6px}
.stats b{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:#4a6a60}
#msg{font-size:13px;color:#4a6a60;min-height:19px;margin-bottom:8px}
.row{display:flex;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 14px;background:#dfe9e4;color:#12332b;flex:1}
button:focus-visible{outline:3px solid #1565d8;outline-offset:2px}
#go{flex:2;background:#17493f;color:#fff}
#go.on{background:#b3261e}
#sheet{display:none;position:fixed;left:0;right:0;top:0;max-height:75%;overflow:auto;z-index:1100;background:#f4f7f5;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:1px solid #c9d6d0}
#sheet.open{display:block}
.t{padding:10px 0;border-bottom:1px solid #dfe9e4}
.t small{display:block;color:#4a6a60}
.t .row{margin-top:8px}
.t button{padding:9px 10px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div id="sheet"></div>
<div id="bar">
  <div class="stats">
    <div><b id="d">0,00</b><span>km</span></div>
    <div><b id="t">00:00:00</b><span>tempo</span></div>
    <div><b id="g">0</b><span>m salita</span></div>
    <div><b id="v">0,0</b><span>km/h media</span></div>
  </div>
  <div id="msg">Pronto. Premi Avvia per registrare.</div>
  <div class="row">
    <button id="go">Avvia</button>
    <button id="dl">Scarica area</button>
    <button id="tr">Tracce</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t;
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([41.9, 12.5], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
L.control.attribution({ position: 'topleft', prefix: false }).addAttribution('© OpenStreetMap').addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);
const line = L.polyline([], { color: '#1565d8', weight: 5 }).addTo(map);
let me = null, pts = [], dist = 0, gain = 0, ref = null, t0 = 0, wid = null, lock = null, timer = null;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
navigator.geolocation && navigator.geolocation.getCurrentPosition(
  p => map.setView([p.coords.latitude, p.coords.longitude], 15), () => {});

const pad = n => String(n).padStart(2, '0');
const hms = s => pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(Math.floor(s % 60));
const km = m => (m / 1000).toFixed(2).replace('.', ',');
const load = () => { try { return JSON.parse(localStorage.getItem('tracks') || '[]'); } catch (e) { return []; } };
const store = a => { try { localStorage.setItem('tracks', JSON.stringify(a)); return true; } catch (e) { return false; } };

function tick() {
  const s = (Date.now() - t0) / 1000;
  $('t').textContent = hms(s); $('d').textContent = km(dist);
  $('g').textContent = Math.round(gain);
  $('v').textContent = (s > 0 ? dist / s * 3.6 : 0).toFixed(1).replace('.', ',');
}

async function getLock() {
  try { if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (wid !== null && document.visibilityState === 'visible') getLock(); });

function onPos(p) {
  const c = p.coords;
  if (c.accuracy > 50) { msg('Segnale GPS debole, attendo…'); return; }
  const ll = [c.latitude, c.longitude];
  if (!me) me = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1565d8', fillOpacity: 1 }).addTo(map);
  else me.setLatLng(ll);
  const last = pts[pts.length - 1];
  if (last) {
    const d = map.distance([last.lat, last.lon], ll);
    if (d < 5) return;
    dist += d;
  }
  if (c.altitude != null) {
    if (ref === null) ref = c.altitude;
    const dz = c.altitude - ref;
    if (dz >= 3) { gain += dz; ref = c.altitude; } else if (dz <= -3) ref = c.altitude;
  }
  pts.push({ lat: c.latitude, lon: c.longitude, ele: c.altitude, t: p.timestamp });
  line.addLatLng(ll);
  map.panTo(ll);
  msg('Registrazione in corso. Tieni lo schermo acceso.');
}

function start() {
  if (!navigator.geolocation) { msg('Questo browser non supporta il GPS.'); return; }
  pts = []; dist = 0; gain = 0; ref = null; t0 = Date.now(); line.setLatLngs([]);
  wid = navigator.geolocation.watchPosition(onPos,
    e => msg(e.code === 1 ? 'Permesso di posizione negato. Abilitalo nelle impostazioni di Safari.' : 'GPS non disponibile.'),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  getLock();
  timer = setInterval(tick, 1000);
  $('go').textContent = 'Ferma'; $('go').classList.add('on');
}

function stop() {
  navigator.geolocation.clearWatch(wid); wid = null;
  clearInterval(timer); tick();
  if (lock) { lock.release().catch(() => {}); lock = null; }
  $('go').textContent = 'Avvia'; $('go').classList.remove('on');
  if (pts.length > 1) {
    const a = load();
    a.unshift({ name: new Date(t0).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }), dist, gain: Math.round(gain), secs: Math.round((Date.now() - t0) / 1000), pts });
    msg(store(a) ? 'Traccia salvata in “Tracce”.' : 'Spazio esaurito: esporta e cancella qualche traccia.');
  } else msg('Traccia troppo breve, non salvata.');
}

$('go').onclick = () => wid === null ? start() : stop();

function gpx(t) {
  const seg = t.pts.map(p => '<trkpt lat="' + p.lat + '" lon="' + p.lon + '">' + (p.ele != null ? '<ele>' + p.ele.toFixed(1) + '</ele>' : '') + '<time>' + new Date(p.t).toISOString() + '</time></trkpt>').join('');
  return '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Tracce offline" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>' + t.name + '</name><trkseg>' + seg + '</trkseg></trk></gpx>';
}

function render() {
  const a = load();
  $('sheet').innerHTML = a.length ? a.map((t, i) => '<div class="t"><b>' + t.name + '</b><small>' + km(t.dist) + ' km · ' + hms(t.secs) + (t.gain != null ? ' · ' + t.gain + ' m salita' : '') + ' · ' + (t.secs ? t.dist / t.secs * 3.6 : 0).toFixed(1).replace('.', ',') + ' km/h</small><div class="row"><button data-s="' + i + '">Mostra</button><button data-x="' + i + '">Esporta GPX</button><button data-r="' + i + '">Elimina</button></div></div>').join('')
    : '<p>Nessuna traccia salvata. Registra un percorso con Avvia.</p>';
}
$('tr').onclick = () => { render(); $('sheet').classList.toggle('open'); };
$('sheet').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = load();
  if (b.dataset.s != null) {
    const t = a[b.dataset.s], ll = t.pts.map(p => [p.lat, p.lon]);
    line.setLatLngs(ll); map.fitBounds(L.latLngBounds(ll), { padding: [30, 30] });
    $('sheet').classList.remove('open');
  } else if (b.dataset.x != null) {
    const t = a[b.dataset.x], l = document.createElement('a');
    l.href = URL.createObjectURL(new Blob([gpx(t)], { type: 'application/gpx+xml' }));
    l.download = 'traccia-' + new Date(t.pts[0].t).toISOString().slice(0, 10) + '.gpx';
    l.click();
  } else if (b.dataset.r != null) {
    if (confirm('Eliminare questa traccia?')) { a.splice(b.dataset.r, 1); store(a); render(); }
  }
};

function tilesFor(b, z) {
  const n = 2 ** z, out = [];
  const X = lon => Math.floor((lon + 180) / 360 * n);
  const Y = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n); };
  for (let x = X(b.getWest()); x <= X(b.getEast()); x++)
    for (let y = Y(b.getNorth()); y <= Y(b.getSouth()); y++)
      out.push('https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png');
  return out;
}

$('dl').onclick = async () => {
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) { msg('Ricarica la pagina e riprova.'); return; }
  const b = map.getBounds(), z0 = Math.min(Math.round(map.getZoom()), 16);
  let list = [];
  for (let z = z0; z <= Math.min(z0 + 2, 16); z++) {
    const l = tilesFor(b, z);
    if (list.length + l.length > 250) break;
    list = list.concat(l);
  }
  if (!list.length) { msg('Area troppo grande: avvicina la mappa e riprova.'); return; }
  let done = 0;
  const w = async () => {
    while (list.length) {
      const u = list.pop();
      try { await fetch(u, { mode: 'no-cors' }); } catch (e) {}
      msg('Scarico la mappa… ' + (++done));
    }
  };
  await Promise.all([w(), w(), w(), w()]);
  msg('Area salvata per l’uso offline (' + done + ' riquadri).');
};
</script>
</body>
</html>
